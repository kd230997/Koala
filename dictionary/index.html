<!DOCTYPE html>
<html>
	<head>
		<title>Excel Data as HTML</title>
	</head>
	<body>
		<table>
			<thead>
				<tr>
					<th>Vocabulary</th>
					<th>Mean</th>
				</tr>
			</thead>
			<tbody>
				{% for row in data %}
				<tr>
					<td>{{ row['vocabulary'] }}</td>
					<td>{{ row['mean'] }}</td>
				</tr>
				{% endfor %}
			</tbody>
		</table>
	</body>
</html>
